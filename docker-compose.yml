services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      MEDIA_DIR: /data/media
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - media:/data/media
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  migrate:
    build:
      target: tools
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "db:migrate"]
  db:
    image: postgres:17-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  pgdata:
  media:
